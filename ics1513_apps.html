<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICS1513 — Apps interactivas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anaheim&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --purple:      #9B72CF;
    --purple-dark: #7B4DB0;
    --purple-dim:  #F3EDFB;
    --bg:          #F7F5FB;
    --surface:     #FFFFFF;
    --border:      #E2D9F0;
    --text:        #1A1A2E;
    --muted:       #7A7A9A;
    --font: "Anaheim", sans-serif;
    --sidebar-w: 248px;
    --header-h:   52px;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  header {
    height: var(--header-h);
    background: var(--purple);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 14px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(100,60,180,0.2);
  }
  .logo {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
    white-space: nowrap;
  }
  .logo-sep { width: 1px; height: 20px; background: rgba(255,255,255,0.28); }
  header h1 { font-size: 0.98rem; font-weight: 400; color: #fff; letter-spacing: 0.02em; }

  /* LAYOUT */
  .layout { display: flex; flex: 1; overflow: hidden; }

  /* SIDEBAR */
  aside {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }

  .sidebar-section {
    padding: 12px 14px 8px;
    font-size: 0.64rem;
    font-weight: 500;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--purple);
    background: var(--purple-dim);
    border-bottom: 1px solid var(--border);
  }

  .app-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 13px 14px;
    border-bottom: 1px solid var(--border);
    border-left: 3px solid transparent;
    cursor: pointer;
    transition: background 0.14s;
    text-align: left;
    background: none;
    border-top: none;
    border-right: none;
    width: 100%;
    font-family: var(--font);
  }
  .app-item:hover { background: var(--purple-dim); }
  .app-item.active {
    background: var(--purple-dim);
    border-left-color: var(--purple);
  }
  .app-unit {
    font-size: 0.63rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--purple);
  }
  .app-name {
    font-size: 0.88rem;
    color: var(--text);
    line-height: 1.3;
  }
  .app-desc {
    font-size: 0.71rem;
    color: var(--muted);
    line-height: 1.4;
    margin-top: 2px;
  }

  .sidebar-footer {
    margin-top: auto;
    padding: 14px;
    font-size: 0.67rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    line-height: 1.7;
  }

  /* MAIN */
  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .app-bar {
    padding: 9px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-shrink: 0;
    min-height: 36px;
  }
  .current-unit {
    font-size: 0.68rem;
    color: var(--purple);
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .current-name { font-size: 0.92rem; color: var(--text); }

  .frame-wrap { flex: 1; overflow: hidden; background: #fff; position: relative; }

  iframe { width: 100%; height: 100%; border: none; display: block; }

  .empty-state {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; color: var(--muted);
  }
  .empty-icon {
    width: 52px; height: 52px;
    border-radius: 14px;
    background: var(--purple-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  .empty-state p { font-size: 0.88rem; }
</style>
</head>
<body>

<header>
  <span class="logo">ICS1513</span>
  <div class="logo-sep"></div>
  <h1>Introduccion a la Economia &mdash; Apps interactivas</h1>

      <iframe id="frame" style="display:none"></iframe>

  </main>
</div>

    const app = APPS[idx];
    document.getElementById("cur-unit").textContent = app.unit;
    document.getElementById("cur-name").textContent = app.name;
    document.getElementById("empty").style.display = "none";

    const frame = document.getElementById("frame");
    frame.style.display = "block";

    // Decode base64 -> blob -> object URL
    const bytes  = atob(app.b64);
    const arr    = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
    const blob   = new Blob([arr], {type: "text/html"});
    const url    = URL.createObjectURL(blob);

    if (prevUrl) URL.revokeObjectURL(prevUrl);
    prevUrl = url;
    frame.src = url;
  }
</script>
</body>
</html>
